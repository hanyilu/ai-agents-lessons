<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agents 深入学习 · 课程归档</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f2ec; color: #222; line-height: 1.75; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 32px 20px 60px; }
  header { background: linear-gradient(135deg, #1e1b4b, #4c1d95); color: #fff; border-radius: 16px; padding: 28px 26px; }
  header h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.4; }
  header p { margin: 0; opacity: .9; }
  .lesson { display: block; background: #fff; border-radius: 14px; padding: 20px 24px; margin-top: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border-left: 5px solid #4c1d95; text-decoration: none; color: inherit; }
  .lesson .day { font-size: 12px; letter-spacing: 2px; font-weight: 700; color: #6b7280; }
  .lesson h2 { margin: 6px 0 6px; font-size: 19px; line-height: 1.5; }
  .lesson p { margin: 0; font-size: 14px; color: #555; }
  .lesson .meta { margin-top: 8px; font-size: 12px; color: #9ca3af; }
  footer { margin-top: 28px; text-align: center; font-size: 12px; color: #9ca3af; }
  header { padding-right: 66px; }
  .navbtn { position: fixed; top: 14px; right: 14px; z-index: 100; width: 40px; height: 40px; border-radius: 50%; border: none; background: #fff; color: #1e1b4b; font-size: 20px; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .navoverlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 101; display: none; }
  .navoverlay.open { display: block; }
  .navdrawer { position: fixed; top: 0; right: 0; width: min(320px, 85vw); height: 100%; background: #fff; z-index: 102; transform: translateX(100%); transition: transform .25s ease; overflow-y: auto; padding: 20px; box-shadow: -2px 0 12px rgba(0,0,0,.2); }
  .navdrawer.open { transform: translateX(0); }
  .navdrawer h3 { margin: 0 0 4px; font-size: 17px; }
  .nd-close { position: absolute; top: 12px; right: 14px; border: none; background: none; font-size: 22px; cursor: pointer; color: #666; }
  .nd-item { display: block; text-decoration: none; color: inherit; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .nd-item.cur { border-color: #4c1d95; background: #f5f3ff; }
  .nd-day { font-size: 12px; color: #6b7280; font-weight: 700; letter-spacing: 1px; }
  .nd-title { font-size: 14px; line-height: 1.5; margin-top: 2px; }
  .nd-meta { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .nd-home { display: block; margin-top: 14px; font-size: 14px; color: #1d4ed8; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>AI Agents 深入学习 · 课程归档</h1>
  <p>课程的带样式网页归档，每天同步新课。</p>
</header>
<main>
  <a class="lesson" href="lessons/day-01-token-context-window.html">
    <div class="day">第 1 天</div>
    <h2>Token 与上下文窗口：Agent 系统的两项核心约束</h2>
    <p>先讲分词与生成——文本按高频合并切成 token，模型不是懂词，是算下一个 token 的概率、选一个接回去再重复；再讲窗口是容量不是记忆，满了就挤出旧块，中间还容易被忽略，账单按圈数翻倍。</p>
    <div class="meta">2026-11-01 · 约 12 分钟</div>
  </a>
</main>
<footer>每天 21:00 左右同步当天新课</footer>
</div>
<button class="navbtn" id="navbtn" aria-label="打开课程目录">☰</button>
<div class="navoverlay" id="navoverlay"></div>
<aside class="navdrawer" id="navdrawer" aria-label="课程目录">
  <button class="nd-close" id="ndclose" aria-label="关闭目录">×</button>
  <h3>课程目录</h3>
  <div id="ndlist"></div>
  <a class="nd-home" id="ndhome" href="index.html">← 回到首页</a>
</aside>
<script>
(function(){
  var btn = document.getElementById('navbtn');
  var overlay = document.getElementById('navoverlay');
  var drawer = document.getElementById('navdrawer');
  var list = document.getElementById('ndlist');
  var home = document.getElementById('ndhome');
  var inLessons = /\/lessons\//.test(location.pathname);
  var jsonUrl = inLessons ? '../lessons.json' : 'lessons.json';
  var prefix = inLessons ? '' : 'lessons/';
  home.href = inLessons ? '../index.html' : 'index.html';
  function open(){ drawer.classList.add('open'); overlay.classList.add('open'); }
  function close(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
  btn.addEventListener('click', open);
  document.getElementById('ndclose').addEventListener('click', close);
  overlay.addEventListener('click', close);
  var cur = location.pathname.split('/').pop();
  fetch(jsonUrl).then(function(r){ return r.json(); }).then(function(items){
    list.innerHTML = '';
    items.forEach(function(it){
      var a = document.createElement('a');
      a.className = 'nd-item' + (it.file === cur ? ' cur' : '');
      a.href = prefix + it.file;
      a.innerHTML = '<div class="nd-day">第 ' + it.day + ' 天</div><div class="nd-title">' + it.title + '</div><div class="nd-meta">' + it.date + ' · 约 ' + it.minutes + ' 分钟</div>';
      list.appendChild(a);
    });
  }).catch(function(){
    list.innerHTML = '<p style="font-size:14px;color:#666;">目录加载失败，请点“回到首页”查看全部课程。</p>';
  });
})();
</script>
</body>
</html>
